name: Feature request
description: Suggest an improvement to SIMAI Framework IntelliSense.
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        The extension suggests only what the SIMAI Framework registry marks as safe
        to suggest. To ask for a component, class or token to be added to the
        Framework, open an issue in
        [simai/ui-source](https://github.com/simai/ui-source/issues).
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do, and what gets in the way?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: How should the extension help?
  - type: textarea
    id: context
    attributes:
      label: Context
      description: Languages, frameworks (for example Larena or Bitrix) or examples.
